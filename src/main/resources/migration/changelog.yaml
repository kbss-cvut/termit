    -   id: 8
        changes:
            -   type: sparqlUpdate
                query: |
                    # Delete data description migrated from popis dat because it may be in the default context
                    # We will re-import it next
                    PREFIX skos: <http://www.w3.org/2004/02/skos/core#>
                    
                    DELETE {
                        ?x ?y ?z .
                    } WHERE {
                      ?x a skos:Concept ;
                         ?y ?z .
                      FILTER (STRSTARTS(STR(?x), "http://onto.fel.cvut.cz/ontologies/data-description"))
                    }
    -   id: 9
        changes:
            -   type: importFromUrl
                # Import data description ontology into a specific context (simpler future updates)
                sourceUrl: https://onto.fel.cvut.cz/ontologies/data-description/version/2.0.0.ttl
                graph: http://onto.fel.cvut.cz/ontologies/data-description
                replace: true
    -   id: 10
        changes:
            -   type: sparqlUpdate
                query: |
                    INSERT DATA {
                        GRAPH <http://onto.fel.cvut.cz/ontologies/data-description> {
                            <http://onto.fel.cvut.cz/ontologies/data-description> a <http://onto.fel.cvut.cz/ontologies/application/termit/read-only> .
                        }
                        GRAPH <http://onto.fel.cvut.cz/ontologies/application/termit> {
                            <http://onto.fel.cvut.cz/ontologies/application/termit> a <http://onto.fel.cvut.cz/ontologies/application/termit/read-only> .
                        }
                    }
                        
