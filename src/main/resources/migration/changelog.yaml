# yaml-language-server: $schema=https://raw.githubusercontent.com/kbss-cvut/ontology-migration-tool/refs/heads/main/src/main/resources/changelog-scheme.json

changelog:
    -   include:
            file: modelSimplification.yaml
            relativeToChangelogFile: true
    -   include:
            file: translatedOntologies.yaml
            relativeToChangelogFile: true
    -   include:
            file: ontologiesReadOnly.yaml
            relativeToChangelogFile: true
    -   changeSet:
            id: 11
            changes:
                -   type: importFromUrl
                    # Import data description ontology update https://github.com/kbss-cvut/data-description/pull/33
                    sourceUrl: https://onto.fel.cvut.cz/ontologies/data-description/version/2.0.0.ttl
                    graph: http://onto.fel.cvut.cz/ontologies/data-description
                    replace: true
    -   include:
            file: rulesetUpdate.yaml
            relativeToChangelogFile: true
    -   changeSet:
            id: 13
            changes:
                -   type: importFromUrl
                    # SKOS Collection snapshots
                    sourceUrl: https://onto.fel.cvut.cz/ontologies/data-description/version/2.1.0.ttl
                    graph: http://onto.fel.cvut.cz/ontologies/data-description
                    replace: true
    -   changeSet:
            id: 14
            changes:
                -   type: importFromUrl
                    # SKOS Collection change tracking and custom attribute profiles
                    sourceUrl: https://raw.githubusercontent.com/kbss-cvut/termit-docker/cddb4a79c0b18f1f4a3962a10797ea5e923373a9/db-server/init-data/termit.trig
                    graph: http://onto.fel.cvut.cz/ontologies/application/termit
                    mimeType: "application/trig"
                    replace: true
